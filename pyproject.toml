[build-system]
requires = ["setuptools >= 61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r_media"
version = "0.1.5"
authors = [
  { name="Marcel Schmutz", email="mschmut@ethz.ch" },
]
description = "Lightweight library for camera / video handling in the ETH Zurich 3R Hub"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy >= 2",
    "opencv-python >= 4",
    "reactivex >= 4.0.0",
]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["py3r.media*"]
