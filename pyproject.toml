[build-system]
requires = ["setuptools >= 61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r_media"
version = "0.6.0"
authors = [
  { name="Marcel Schmutz", email="mschmut@ethz.ch" },
]
description = "Lightweight library for video and audio handling in the ETH Zurich 3R Hub"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy >= 2",
    "opencv-python >= 4",
    "reactivex >= 4.0.0",
    "av >= 13",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8",
]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["py3r.media*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires physical capture hardware (webcam, Pylon camera, …)",
]
